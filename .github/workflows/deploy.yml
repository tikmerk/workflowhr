name: Build and Push Dist for Multiple cPanels

on:
  push:
    branches:
      - main # মূল main ব্রাঞ্চে পুশ করলেই রান হবে

jobs:
  # ১. আপনার ওয়েবসাইটের জন্য বিল্ড
  build-my-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Node.js 22 আপডেট করা হয়েছে
      - name: Build My Site
        env:
          VITE_BASE_PATH: ${{ secrets.MY_SUBFOLDER }}
        run: |
          npm install
          npm run build
      - name: Push to my build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build # 'build' ব্রাঞ্চে জমা হবে

  # ২. ক্লায়েন্টের ওয়েবসাইটের জন্য বিল্ড
  build-client-site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Node.js 22 আপডেট করা হয়েছে
      - name: Build Client Site
        env:
          VITE_BASE_PATH: ${{ secrets.CLIENT_SUBFOLDER }}
        run: |
          npm install
          npm run build
      - name: Push to client-build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: client-build # 'client-build' ব্রাঞ্চে জমা হবে
